name: Free Market Table Print Audit
description: Request free public-safe feedback on price tags, QR signs, flyers, coupons, and pickup notes.
title: "Free audit request: Market Table Print Audit"
labels:
  - audit-request
  - market-table-print-audit
body:
  - type: markdown
    attributes:
      value: |
        Use this public issue form to request a free Market Table Print Audit. No payment is collected for this audit, and an audit request is not revenue.

        Share only public-safe business, event, offer, and print-piece details. Do not post card numbers, bank details, payout details, tax identifiers, identity documents, private addresses, customer lists, platform credentials, passwords, or private account information.
  - type: checkboxes
    id: audit_gate
    attributes:
      label: Free audit and privacy acknowledgement
      options:
        - label: I understand this is a free audit request and not a paid order.
          required: true
        - label: I will not post card, bank, payout, tax, identity, credential, password, private address, customer-list, or private account details here.
          required: true
  - type: input
    id: business_name
    attributes:
      label: Business, booth, event, or service name
      placeholder: Example: Sunny Table Bakes
    validations:
      required: true
  - type: textarea
    id: offer_summary
    attributes:
      label: What do you sell or promote?
      placeholder: Handmade cookies for a weekend market table, local tutoring, repair service, workshop, community event...
    validations:
      required: true
  - type: dropdown
    id: use_case
    attributes:
      label: Where will this be used?
      options:
        - market table
        - local pickup
        - workshop or class
        - local service
        - online-to-local
        - other
    validations:
      required: true
  - type: textarea
    id: current_items
    attributes:
      label: Current price list, menu, or item examples
      description: Public-safe examples only. Do not include private buyer, payment, bank, tax, or customer details.
      placeholder: |
        Cookie bag - $6
        Brownie box - $10
        Market bundle - 2 for $15
    validations:
      required: true
  - type: input
    id: qr_contact
    attributes:
      label: Current QR/contact link or public-safe contact method
      placeholder: https://example.com/order
    validations:
      required: true
  - type: checkboxes
    id: current_print_pieces
    attributes:
      label: What print pieces do you already have?
      options:
        - label: price tags or menu rows
        - label: flyer or table note
        - label: QR/contact sign
        - label: coupon or bundle offer
        - label: packing or pickup note
        - label: none yet
  - type: textarea
    id: confusing_part
    attributes:
      label: What feels confusing or unfinished?
      placeholder: Prices are hard to read, no QR sign yet, coupon wording is messy, pickup notes are unclear...
    validations:
      required: true
  - type: input
    id: event_date
    attributes:
      label: Need-by date or event date
      placeholder: 2026-06-10
  - type: dropdown
    id: upgrade_interest
    attributes:
      label: Would you want a $29 done-for-you setup if the audit shows obvious gaps?
      options:
        - maybe
        - yes
        - no
    validations:
      required: true
  - type: textarea
    id: public_contact
    attributes:
      label: Public-safe contact preference
      description: Public issues are visible. Say "reply in this issue" if you do not want to post contact details.
      placeholder: Reply in this issue / public website contact page / public social profile
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Optional public-safe context. Do not include sensitive personal, payment, payout, tax, identity, credential, private address, customer-list, or account details.
